[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holy-weather"
version = "0.1.0"
description = "Finite, independent public temperature-market observer"
requires-python = ">=3.11"
dependencies = ["websockets==17.4"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
holy-weather = "holy_weather.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
