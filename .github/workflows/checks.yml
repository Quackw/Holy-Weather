name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --index-url https://pypi.org/simple -c requirements-dev.lock -e '.[test]'
      - name: Prepare isolated dependency rollback
        run: |
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --no-deps --target "$RUNNER_TEMP/websockets-17.1" 'websockets==17.1'
      - name: Build pinned wheel
        run: python -m pip wheel --index-url https://pypi.org/simple --no-deps --wheel-dir "$RUNNER_TEMP/holy-weather-dist" .
      - run: python -B tools/check_source.py
      - run: python -B -m pytest -q
        env:
          HOLY_WEATHER_WEBSOCKETS_ROLLBACK_DIR: ${{ runner.temp }}/websockets-17.1
